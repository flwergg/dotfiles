# Sway startup configuration file

# Necesario para que apps con toolkit qt/gtk/electron sepan que estamos en Wayland
exec dbus-update-activation-environment --systemd --all

exec swaync &
exec ~/.local/bin/start-quickshell.sh
exec awww-daemon
exec ~/.config/scripts/wallpaper-changer.sh &
exec ~/.config/scripts/battery-monitor.sh &
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
exec wlsunset -t 5000 -S 8:00 -s 19:30 # NightLight from 7:30pm to 8am
exec /home/gaby/.local/bin/autotiling
exec python3 ~/.config/scripts/inactive-opacity.py --opacity 0.85 &