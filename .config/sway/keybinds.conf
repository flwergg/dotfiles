# Sway keybinds configuration file

# --- Aplicaciones ---
bindsym $mod+q exec kitty
bindsym $mod+e exec nemo
bindsym $mod+t exec xed
bindsym $mod+b exec vivaldi
bindsym $mod+v exec code
bindsym $mod+s exec spotify
bindsym $mod+m exec marktext

# SUPER SHIFT Q (kitty flotante 650x400)
bindsym $mod+Shift+q exec kitty --class kitty-float

# --- Quickshell Panels ---
bindsym $mod+o exec qs ipc call emoji toggle
bindsym $mod+r exec qs ipc call launcher toggle
bindsym $mod+h exec qs ipc call clipboard toggle
bindsym $mod+Shift+w exec qs ipc call wallpaper toggle
bindsym $mod+Shift+s exec qs ipc call music toggle
bindsym $mod+x exec swaync-client -t -sw

# --- Utilidad ---
bindsym $mod+y exec hyprpicker -a
bindsym $mod+w exec ~/.config/scripts/change_wallpaper_once.sh
bindsym $mod+g exec ~/.config/scripts/toggle-theme.sh
bindsym $mod+l exec ~/.config/scripts/lock.sh
bindsym $mod+k exec systemctl suspend && ~/.config/scripts/lock.sh

# --- Navegación de workspaces ---
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

# --- Scratchpad ---
bindsym $mod+a scratchpad show
bindsym $mod+Shift+a move scratchpad

# --- Scroll para cambiar de workspace ---
bindsym $mod+button4 workspace prev
bindsym $mod+button5 workspace next

# --- Mover ventana a workspace ---
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# --- Gestión de ventanas ---
bindsym $mod+space floating toggle
bindsym $mod+f fullscreen toggle
bindsym $mod+c kill
bindsym $mod+j layout toggle split

# --- Foco entre ventanas ---
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down

# --- Mover ventanas ---
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down

# --- Resize ---
bindsym $mod+Ctrl+Left resize shrink width 20px
bindsym $mod+Ctrl+Right resize grow width 20px
bindsym $mod+Ctrl+Up resize shrink height 20px
bindsym $mod+Ctrl+Down resize grow height 20px

# --- Mouse ---
floating_modifier $mod normal

# --- Screenshots ---
bindsym Print exec grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot Copied"
bindsym Ctrl+Print exec grim ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d_%H%M%S).png && notify-send "Screenshot Saved"
bindsym Shift+Print exec grim -g "$(slurp)" - | swappy -f -

# --- Multimedia keys ---
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+ && qs ipc call osd volume
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%- && qs ipc call osd volume
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && qs ipc call osd volume
bindsym --locked XF86MonBrightnessUp exec brightnessctl -e4 -n2 set 1%+ && qs ipc call osd brightness
bindsym --locked XF86MonBrightnessDown exec brightnessctl -e4 -n2 set 1%- && qs ipc call osd brightness

# --- Control de sesión ---
bindsym $mod+n exit
